# Исповедь — host network (на VPS Docker-bridge часто без выхода в Telegram)
# Порты: бот 8080, Caddy 80/443 — на хосте напрямую

services:
  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ispoved-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      PORT: "8080"
      API_HOST: "0.0.0.0"
      DB_PATH: "/app/data/ispoved.db"
    volumes:
      - ispoved_data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: ispoved-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  ispoved_data:
  caddy_data:
  caddy_config:
